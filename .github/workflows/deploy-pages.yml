# Builds the Flutter web app and publishes it to GitHub Pages.
#
# The API origin is baked in at BUILD time via --dart-define, so the shipped
# bundle never needs editing. If the backend moves, change it here.
#
# Output URL: https://dardouriyoussef02-jpg.github.io/Delivery-APP/
# The `--base-href` must match that path (repo name), otherwise assets 404.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; do not cancel an in-flight one either, so a
# finished deploy always leaves the site in a consistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so CI matches the version this project is verified on.
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Goldens are excluded: font rasterisation differs per OS, so the design
      # lock is regenerated locally with `flutter test --update-goldens`.
      - name: Analyse
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build web
        run: >
          flutter build web --release
          --dart-define=API_BASE_URL=https://delivery-ai-agent-ahl8.onrender.com
          --base-href "/Delivery-APP/"

      - uses: actions/upload-pages-artifact@v3
        with:
          # Not affected by defaults.run.working-directory (uses, not run).
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
