name: delivery_driver
description: Driver app for the delivery business - route, stops and an AI assistant that turns delivery notes into a suggested next action and a ready-to-review customer message.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/deliveries.json
